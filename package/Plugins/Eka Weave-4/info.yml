description: "Four-voice pitch harmonizer.<br/>

Four harmony voices plus dry signal: independent intervals, 14 chord types with voice leading, diatonic scales, or MIDI-driven target notes with an embedded input pitch tracker; per-voice tempo-synced delay, fine detune / humanize, HPF/LPF filters, four scenes (A–D) and 9 factory presets.
